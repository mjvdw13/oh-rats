<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>OH, RATS!</title>
  <meta name="description" content="OH, RATS!: a zombie rat with a bone shotgun takes on every rat in a big house, and then Dad.">
  <meta name="theme-color" content="#000000">
  <!-- Link previews (Slack, Teams, chat apps). Previews need absolute URLs:
       change these if the game is hosted somewhere other than GitHub Pages. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="OH, RATS!">
  <meta property="og:description" content="You are a zombie rat with a shotgun made of bones. Clear the house, climb through the vents, and face Dad.">
  <meta property="og:url" content="https://mjvdw13.github.io/oh-rats/">
  <meta property="og:image" content="https://mjvdw13.github.io/oh-rats/docs/screenshots/title.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/ui/favicon.png">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <main id="stage">
    <canvas id="screen" width="320" height="200" aria-label="Oh, Rats! game screen" tabindex="0"></canvas>
    <div id="boot-message" role="status">LOADING...</div>
  </main>
  <noscript><p class="noscript">OH, RATS! needs JavaScript to run.</p></noscript>
  <script>
    // ES modules don't load from file:// URLs, so explain how to run the game locally.
    if (location.protocol === 'file:') {
      document.getElementById('boot-message').innerHTML =
        'OH, RATS! must be served over HTTP.<br>Run <code>npx http-server</code> in the repo folder<br>and open the URL it prints.';
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
